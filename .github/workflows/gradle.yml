name: Build spawnfix Fabric
on:
  workflow_dispatch:
  push:
    branches:
      - build/a0905ad-spawnfix-fabric
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build Fabric core
        run: |
          chmod +x gradlew
          ./gradlew :bootstrap:fabricJar --no-daemon --stacktrace --console=plain
      - name: Record source and hashes
        run: |
          git rev-parse HEAD > bootstrap/build/libs/SOURCE_COMMIT.txt
          sha256sum bootstrap/build/libs/arclight-fabric-*.jar > bootstrap/build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arclight-a0905ad-spawnfix-fabric
          path: |
            bootstrap/build/libs/arclight-fabric-*.jar
            bootstrap/build/libs/SOURCE_COMMIT.txt
            bootstrap/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
